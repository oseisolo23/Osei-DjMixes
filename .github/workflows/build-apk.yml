name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Could not detect Java version"
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version must be 17 or newer, got $JAVA_MAJOR"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "::error::Expected APK not found at $TARGET_APK"
            echo "Discovered APK files under app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "::error::Generated APK is empty"
            exit 1
          fi
          echo "Successfully verified $TARGET_APK ($(stat -c%s "$TARGET_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_DIR/app-debug.apk"
          echo "release_asset_path=$RELEASE_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.release_asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset is invalid or missing"
            exit 1
          fi
          ASSET_FILENAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_FILENAME" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be app-debug.apk, got $ASSET_FILENAME"
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          cat << 'EOF' > release_notes.md
          ## Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run:** #${{ github.run_number }} (Attempt ${{ github.run_attempt }})
          - **Commit:** ${{ github.sha }}
          - **Intended Purpose:** Testing and evaluation only
          - **Signing:** Signed with temporary debug keystore
          EOF

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH#app-debug.apk" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest

          rm -f release_notes.md

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            echo "GitHub Release published successfully."
            gh release view "$RELEASE_TAG" || true
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "Direct Download Link: $DIRECT_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The GitHub Actions artifact **app-debug-apk** is also available as a backup." >> "$GITHUB_STEP_SUMMARY"
            echo "DIRECT APK DOWNLOAD URL: $DIRECT_URL"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully and is preserved as GitHub Actions artifact 'app-debug-apk'."
            fi
          fi
